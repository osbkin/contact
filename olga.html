<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olga Novikova</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 28px;
      max-width: 360px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }
    .hero {
      background: #c1e6e7;
      border-radius: 0 0 60% 60% / 0 0 40px 40px;
      padding: 2rem 1.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero-name { color: #1b3637; font-size: 22px; font-weight: 700; text-align: center; }
    .hero-role { color: rgba(27,54,55,0.75); font-size: 13px; text-align: center; margin-top: 4px; }
    .hero-sub { color: rgba(27,54,55,0.55); font-size: 11px; text-align: center; margin-top: 3px; margin-bottom: 1.25rem; }
    .photo-wrap {
      width: 110px; height: 110px; border-radius: 50%;
      border: 4px solid white; overflow: hidden;
      margin-bottom: -55px; position: relative; z-index: 2;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15); background: #9cd7d9;
    }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .body { padding: 4rem 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .action-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 0.5rem; }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 6px; background: #c1e6e7; border-radius: 14px;
      color: #1b3637; text-decoration: none; font-size: 11px; font-weight: 600;
    }
    .action-btn:hover { background: #9cd7d9; }
    .action-btn svg { width: 22px; height: 22px; fill: #1b3637; }
    .info-list { display: flex; flex-direction: column; gap: 2px; }
    .info-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 14px; background: #f5f7fa;
      border-radius: 14px; text-decoration: none; color: inherit;
    }
    .info-item:hover { background: #eaecf5; }
    .info-icon {
      width: 38px; height: 38px; border-radius: 50%;
      background: #dbebeb; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .info-icon svg { width: 18px; height: 18px; fill: #1b3637; }
    .info-label { font-size: 11px; color: #999; margin-bottom: 2px; }
    .info-value { font-size: 14px; font-weight: 500; color: #111; }
    .save-row { display: flex; justify-content: center; }
    .btn-save {
      display: flex; align-items: center; gap: 8px;
      background: #c1e6e7; color: #1b3637; padding: 12px 24px;
      border-radius: 50px; font-size: 14px; font-weight: 600; text-decoration: none;
    }
    .btn-save:hover { background: #9cd7d9; }
    .btn-save svg { width: 18px; height: 18px; fill: #1b3637; }
  </style>
</head>
